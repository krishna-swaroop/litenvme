name: DDR read errors
on:
  pull_request:
    paths:
      - 'litenvme/hostmem.py'
      - 'test/test_hostmem*.py'
      - 'test/test_axi_transfer_size.py'
      - '.github/workflows/ddr-read-errors.yml'
  push:
    branches: ['feature/stream-ring']
    paths:
      - 'litenvme/hostmem.py'
      - 'test/test_hostmem*.py'
      - 'test/test_axi_transfer_size.py'
      - '.github/workflows/ddr-read-errors.yml'
permissions:
  contents: read
jobs:
  responder-errors:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: krishna-swaroop/axi-nvme
          ref: 60ad70f0d3ae397365a501c0cbcdea8e2268dde1
          path: .qualification
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install the project's immutable generator dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r .qualification/requirements-development.lock
      - name: Check current-source import and run focused responder tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/test
        run: |
          set -o pipefail
          mkdir -p reports
          .venv/bin/python -c 'from pathlib import Path; import litenvme.hostmem as m; assert Path(m.__file__).resolve().is_relative_to(Path.cwd() / "litenvme"), m.__file__; print(m.__file__)'
          .venv/bin/python -m pip freeze > reports/dependencies.txt
          git rev-parse HEAD > reports/commit.txt
          .venv/bin/python -m pytest -q test/test_hostmem_ddr_errors.py test/test_hostmem.py test/test_hostmem_unaligned.py test/test_axi_transfer_size.py --junitxml=reports/responder-errors.xml | tee reports/responder-errors.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: responder-error-evidence
          path: reports/
          retention-days: 14
